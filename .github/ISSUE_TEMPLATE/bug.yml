name: Bug
description: Report a defect
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Current Behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes

